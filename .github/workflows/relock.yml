name: Relock frontend (scaffolding — remove before merge)

# TEMPORARY workflow used to regenerate frontend/package-lock.json on a
# real Linux runner, because npm on Windows cannot compute the Linux
# ideal tree for platform-specific optional dependencies (see the
# @emnapi/core / @emnapi/runtime gap tracked in this branch). This
# workflow must be deleted before this branch reaches main.
#
# push-only on purpose: workflow_dispatch requires the workflow to
# already exist on the default branch to be runnable, and this one
# doesn't (and shouldn't).
on:
  push:
    branches:
      - ci/github-actions-test-pipeline

permissions:
  contents: read

jobs:
  relock:
    name: Regenerate frontend package-lock.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Must match tests.yml's frontend-tests job so the resulting
          # tree matches what that job will actually install.
          node-version: lts/*

      - name: Regenerate lockfile in place (no dependency upgrades)
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Show what moved
        # working-directory defaults to frontend/ for run: steps, so the
        # path here is relative to that, not the repo root.
        run: git diff --stat package-lock.json

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
